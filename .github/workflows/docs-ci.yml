name: docs-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d1c2439d499f00bb47d5a10e3b0 # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:claims
      - run: npm run build
      - run: npm audit --audit-level=high
